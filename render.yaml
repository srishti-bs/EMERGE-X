# ==============================================================================
# EMERGE-X Render Blueprint (Infrastructure-as-Code)
# https://render.com/docs/blueprint-spec
#
# Deploys:
#   1. emerge-x-backend: FastAPI Python Web Service
#   2. emerge-x-frontend: React + Vite Static Site (with SPA client rewrite)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. FastAPI Backend Web Service
  # ----------------------------------------------------------------------------
  - type: web
    name: emerge-x-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PROJECT_NAME
        value: EMERGE-X
      - key: CORS_ORIGINS
        value: "*"

  # ----------------------------------------------------------------------------
  # 2. React + Vite Frontend Static Site
  # ----------------------------------------------------------------------------
  - type: static
    name: emerge-x-frontend
    region: oregon
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_BACKEND_URL
        fromService:
          type: web
          name: emerge-x-backend
          property: host
